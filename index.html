<style>
  /* One parchment sheet on the dark desk, as in the game. */
  :root {
    --desk: #3b2717; --paper: #f1e4c3; --paper-2: #e4cf9f; --paper-hi: #fbf2da;
    --ink: #3a2615; --ink-soft: #5b4029; --red: #a8341f; --green: #5c7a3a; --green-dark: #3f5827;
    --serif: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --serif-sc: 'IM Fell English SC', 'IM Fell English', 'Iowan Old Style', Palatino, Georgia, serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 40%, #4a3220 0%, var(--desk) 70%);
    color: var(--ink); font-family: var(--serif);
    display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
  }
  main {
    width: min(100%, 25rem);
    background: radial-gradient(110% 80% at 50% 30%, var(--paper-hi), var(--paper) 55%, var(--paper-2));
    border-radius: 4px; padding: 2rem 1.6rem 1.6rem;
    box-shadow: inset 0 0 0 3px #f3e7c9e6, inset 0 0 0 4px #5d422947, inset 0 0 28px #825a2838, 0 14px 36px #0c0601a0;
    display: grid; gap: 1.1rem; text-align: center;
  }
  .rose { width: 5.5rem; height: 5.5rem; margin: 0 auto; display: block; }
  h1 { font: 2.1rem/1.05 var(--serif-sc); margin: 0; letter-spacing: .01em; text-wrap: balance; }
  .lede { margin: -.3rem 0 0; font-style: italic; color: var(--ink-soft); font-size: 1.05rem; line-height: 1.35; text-wrap: balance; }
  form { display: grid; gap: .85rem; text-align: left; }
  form[hidden] { display: none; }
  label.field { font: .95rem var(--serif-sc); letter-spacing: .06em; display: grid; gap: .35rem; }
  .pw { display: flex; gap: .4rem; }
  input[type=password], input[type=text] {
    flex: 1; min-width: 0; font: 1.1rem var(--serif); color: var(--ink);
    padding: .65rem .75rem; border: 1px solid #5d4229; border-radius: 3px;
    background: #fbf5e4; box-shadow: inset 0 1px 3px #3a261530;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  .show { font: .9rem var(--serif-sc); background: transparent; border: 1px solid #5d422980; border-radius: 3px; color: var(--ink-soft); padding: 0 .7rem; cursor: pointer; }
  .remember { display: flex; align-items: center; gap: .55rem; font-size: 1.02rem; }
  .remember input { width: 1.15rem; height: 1.15rem; accent-color: var(--green); margin: 0; }
  #go {
    font: 1.25rem var(--serif-sc); letter-spacing: .04em; color: #fbf2da; cursor: pointer;
    padding: .7rem 1rem; border: 1px solid var(--green-dark); border-radius: 999px;
    background: linear-gradient(#6d8b47, var(--green) 55%, #4d6930); box-shadow: 0 3px 0 var(--green-dark), 0 6px 14px #1c120840;
  }
  #go:disabled { opacity: .6; cursor: progress; }
  #status { min-height: 2.6em; margin: 0; font-size: 1rem; line-height: 1.3; color: var(--ink-soft); text-align: center; }
  #status[data-kind=error] { color: var(--red); }
  .bar { height: 3px; background: #5d422930; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ink-soft); transition: width .2s; }
  .bar.done { visibility: hidden; }
  .foot { margin: 0; font-size: .85rem; color: #5b4029b0; font-style: italic; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

  <h1>Terra Incognita</h1>
  <p class="lede">A private build. Enter the passphrase to unroll the chart.</p>
  <form id="unlock" autocomplete="on">
    <input type="text" name="username" value="Terra Incognita" autocomplete="username" hidden>
    <label class="field" for="pass">Passphrase
      <span class="pw">
        <input id="pass" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" required>
        <button type="button" class="show" id="show" aria-controls="pass" aria-pressed="false">Show</button>
      </span>
    </label>
    <label class="remember" for="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button id="go" type="submit">Unlock</button>
  </form>
  <div class="bar" id="bar" aria-hidden="true"><i></i></div>
  <p id="status" role="status" aria-live="polite"></p>
  <noscript><p id="noscript">This game needs JavaScript.</p></noscript>
  <p class="foot">Build b7b163fbbd20</p>

<script>
(function () {
  'use strict';
  var BLOB = 'game.7f9f325f2abf.bin';
  var SIZE = 5023596;
  var STORE = 'ti.vault.v1';
  var $ = function (id) { return document.getElementById(id); };
  var form = $('unlock'), pass = $('pass'), remember = $('remember'), go = $('go'), status = $('status'), bar = $('bar');

  function say(text, kind) { status.textContent = text; status.dataset.kind = kind || ''; }
  function busy(on) { go.disabled = on; pass.disabled = on; }
  function progress(f) { bar.firstElementChild.style.width = Math.round(Math.min(1, f) * 100) + '%'; if (f >= 1) bar.classList.add('done'); }

  var store = {
    get: function () { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } },
    set: function (v) { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (e) { /* private mode: just don't remember */ } },
    clear: function () { try { localStorage.removeItem(STORE); } catch (e) {} }
  };
  function toB64(u8) { var s = ''; for (var i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
  function fromB64(s) { var b = atob(s), u8 = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i); return u8; }
  function sameBytes(a, b) { if (a.length !== b.length) return false; for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false; return true; }

  $('show').addEventListener('click', function () {
    var on = pass.type === 'password';
    pass.type = on ? 'text' : 'password';
    this.textContent = on ? 'Hide' : 'Show';
    this.setAttribute('aria-pressed', String(on));
  });

  if (!(window.crypto && crypto.subtle && window.TextDecoder && window.DecompressionStream)) {
    busy(true);
    say('This browser cannot open the game. It needs a secure (https) page and a recent browser: Safari 16.4+, Chrome or Firefox.', 'error');
    return;
  }
  if (/[?&]forget(=|&|$)/.test(location.search)) store.clear();

  // Start downloading the sealed game straight away, with progress.
  var vault = (async function () {
    var res = await fetch(BLOB);
    if (!res.ok) throw Object.assign(new Error('HTTP ' + res.status), { kind: 'net' });
    var u8;
    if (res.body && res.body.getReader) {
      var reader = res.body.getReader(), chunks = [], got = 0;
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        chunks.push(r.value); got += r.value.length; progress(got / SIZE);
      }
      u8 = new Uint8Array(got);
      for (var i = 0, o = 0; i < chunks.length; i++) { u8.set(chunks[i], o); o += chunks[i].length; }
    } else {
      u8 = new Uint8Array(await res.arrayBuffer());
    }
    progress(1);
    var magic = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
    if (magic !== 'TIE1' || u8.length < 64) throw Object.assign(new Error('bad file'), { kind: 'damaged' });
    var dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    return { gzip: (u8[4] & 1) === 1, iter: dv.getUint32(5), salt: u8.slice(9, 25), iv: u8.slice(25, 37), aad: u8.slice(0, 37), ct: u8.subarray(37) };
  })();
  vault.then(registerWorker, function () {});

  function registerWorker() {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () { /* offline play just won't be available */ });
  }

  async function deriveKey(passphrase, v) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: v.salt, iterations: v.iter }, base, 256));
  }

  async function decrypt(raw, v) {
    var key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    var plain;
    try {
      plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: v.iv, additionalData: v.aad, tagLength: 128 }, key, v.ct);
    } catch (e) {
      throw Object.assign(new Error('wrong key'), { kind: 'key' });
    }
    try {
      if (!v.gzip) return new TextDecoder().decode(plain);
      var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
      return await new Response(stream).text();
    } catch (e) {
      throw Object.assign(new Error('gunzip failed'), { kind: 'damaged' });
    }
  }

  function openGame(html) {
    // Replace this page with the decrypted game (same URL, same storage, same service worker).
    document.open();
    document.write(html);
    document.close();
  }

  function explain(e) {
    if (e && e.kind === 'key') return 'That passphrase does not open this chart. Check it and try again.';
    if (e && e.kind === 'damaged') return 'The game download was damaged. Reload the page to try again.';
    return 'Could not download the game. Check your connection and reload.';
  }

  form.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var phrase = pass.value.normalize('NFC').trim();
    if (!phrase) { say('Enter the passphrase first.', 'error'); return; }
    busy(true);
    try {
      say('Fetching the chart…');
      var v = await vault;
      say('Checking the passphrase…');
      var raw = await deriveKey(phrase, v);
      var html = await decrypt(raw, v);
      if (remember.checked) store.set({ v: 1, iter: v.iter, salt: toB64(v.salt), key: toB64(raw) });
      else store.clear();
      say('Unrolling the chart…');
      openGame(html);
    } catch (e) {
      busy(false);
      say(explain(e), 'error');
      if (e && e.kind === 'key') { pass.focus(); pass.select(); }
    }
  });

  // A key remembered on this device opens the game without typing.
  var saved = store.get();
  if (saved && saved.key && saved.salt) {
    form.hidden = true;
    say('Opening with the key saved on this device…');
    (async function () {
      try {
        var v = await vault;
        if (saved.iter !== v.iter || !sameBytes(fromB64(saved.salt), v.salt)) throw Object.assign(new Error('stale'), { kind: 'key' });
        openGame(await decrypt(fromB64(saved.key), v));
      } catch (e) {
        form.hidden = false;
        if (e && e.kind === 'key') {
          store.clear();
          say('The key saved on this device does not open this build (the passphrase may have changed). Enter the passphrase again.', 'error');
        } else {
          say(explain(e), 'error');
        }
      }
    })();
  } else {
    vault.catch(function (e) { say(explain(e), 'error'); });
  }
})();
